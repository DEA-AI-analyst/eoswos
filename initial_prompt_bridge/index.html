<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EosWos initial prompt bridge</title>
</head>
<body>
<script>
(() => {
    "use strict";

    const TYPE_RENDER = "streamlit:render";
    const TYPE_COMPONENT_READY = "streamlit:componentReady";
    const TYPE_SET_COMPONENT_VALUE = "streamlit:setComponentValue";
    const TYPE_SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
    const TYPE_READY = "READY";
    const TYPE_INITIAL_PROMPT = "INITIAL_PROMPT";
    const TYPE_ACK = "ACK";
    const TYPE_PROMO_HOST_READY = "PROMO_HOST_READY";
    const TYPE_OPEN_PROMO_VIDEO = "OPEN_PROMO_VIDEO";
    const TYPE_PROMO_VIDEO_ACK = "PROMO_VIDEO_ACK";
    const VERSION = 1;
    const SOURCE = "agent_home_first_prompt";
    const PROMO_SOURCE = "eagent_promo_video";
    const MAX_PROMPT_LENGTH = 500;
    const PROMO_ACK_TIMEOUT_MS = 700;
    const streamlitUrl = new URLSearchParams(window.location.search).get("streamlitUrl");
    let streamlitOrigin = "";
    let parentOrigin = "";
    let promoHostReady = false;
    let promoNativeBypass = false;
    let pendingPromoRequest = null;
    let promoAckTimer = null;
    let streamlitDocument = null;

    try {
        streamlitOrigin = new URL(streamlitUrl).origin;
    } catch (error) {
        return;
    }

    const postToStreamlit = (message) => {
        window.parent.postMessage(message, streamlitOrigin);
    };

    const postToAgentHome = (message) => {
        if (parentOrigin) {
            window.top.postMessage(message, parentOrigin);
        }
    };

    const readyMessage = () => ({
        type: TYPE_READY,
        version: VERSION,
        request_id: null,
        prompt: null,
        source: SOURCE,
    });

    const isExactOrigin = (value) => {
        try {
            const parsed = new URL(value);
            const isLoopback = parsed.hostname === "localhost"
                || parsed.hostname === "127.0.0.1"
                || parsed.hostname === "[::1]";
            return parsed.origin === value && (
                parsed.protocol === "https:"
                || (parsed.protocol === "http:" && isLoopback)
            );
        } catch (error) {
            return false;
        }
    };

    const isInitialPrompt = (value) => Boolean(
        value
        && value.type === TYPE_INITIAL_PROMPT
        && value.version === VERSION
        && value.source === SOURCE
        && typeof value.request_id === "string"
        && typeof value.prompt === "string"
        && value.prompt === value.prompt.trim()
        && value.prompt.length > 0
        && value.prompt.length <= MAX_PROMPT_LENGTH
        && (value.attempt === 1 || value.attempt === 2)
    );

    const isCanonicalRequestId = (value) => (
        typeof value === "string"
        && /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)
    );

    const hasOnlyFields = (value, fields) => {
        const keys = Object.keys(value);
        return keys.length === fields.length && keys.every((key) => fields.includes(key));
    };

    const isPromoHostReady = (value) => Boolean(
        value
        && hasOnlyFields(
            value,
            ["type", "version", "request_id", "prompt", "source", "status"],
        )
        && value.type === TYPE_PROMO_HOST_READY
        && value.version === VERSION
        && value.request_id === null
        && value.prompt === null
        && value.source === PROMO_SOURCE
        && value.status === "ready"
    );

    const isPromoVideoAck = (value) => Boolean(
        value
        && hasOnlyFields(
            value,
            ["type", "version", "request_id", "prompt", "source", "status"],
        )
        && value.type === TYPE_PROMO_VIDEO_ACK
        && value.version === VERSION
        && isCanonicalRequestId(value.request_id)
        && value.prompt === null
        && value.source === PROMO_SOURCE
        && (value.status === "opened" || value.status === "duplicate")
    );

    const createPromoRequestId = () => {
        if (!window.crypto || typeof window.crypto.randomUUID !== "function") {
            return "";
        }
        const requestId = window.crypto.randomUUID();
        return isCanonicalRequestId(requestId) ? requestId : "";
    };

    const clearPromoAckTimer = () => {
        if (promoAckTimer !== null) {
            window.clearTimeout(promoAckTimer);
            promoAckTimer = null;
        }
    };

    const openNativePromoFallback = () => {
        const button = pendingPromoRequest?.button;
        clearPromoAckTimer();
        pendingPromoRequest = null;
        promoHostReady = false;
        if (!button || !button.isConnected) {
            return;
        }
        promoNativeBypass = true;
        try {
            button.click();
        } finally {
            promoNativeBypass = false;
        }
    };

    const finishPromoRequest = () => {
        clearPromoAckTimer();
        pendingPromoRequest = null;
    };

    const sendPromoOpenRequest = () => {
        if (!pendingPromoRequest || !promoHostReady || !parentOrigin) {
            return;
        }
        pendingPromoRequest.attempt += 1;
        postToAgentHome({
            type: TYPE_OPEN_PROMO_VIDEO,
            version: VERSION,
            request_id: pendingPromoRequest.requestId,
            prompt: null,
            source: PROMO_SOURCE,
            attempt: pendingPromoRequest.attempt,
        });
        clearPromoAckTimer();
        promoAckTimer = window.setTimeout(() => {
            if (pendingPromoRequest?.attempt === 1) {
                sendPromoOpenRequest();
                return;
            }
            // The parent may already be playing the video while both ACKs were
            // lost. Do not open a second native dialog in that ambiguity.
            finishPromoRequest();
        }, PROMO_ACK_TIMEOUT_MS);
    };

    const handlePromoClick = (event) => {
        const target = event.target;
        const button = target && typeof target.closest === "function"
            ? target.closest(".st-key-eagent_promo_trigger button")
            : null;
        if (!button || promoNativeBypass) {
            return;
        }
        if (pendingPromoRequest) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return;
        }
        const requestId = createPromoRequestId();
        if (!requestId) {
            return;
        }
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        pendingPromoRequest = {
            requestId: requestId,
            attempt: 0,
            button: button,
        };
        if (promoHostReady) {
            sendPromoOpenRequest();
            return;
        }
        promoAckTimer = window.setTimeout(() => {
            if (pendingPromoRequest?.attempt === 0) {
                openNativePromoFallback();
            }
        }, PROMO_ACK_TIMEOUT_MS);
    };

    const installPromoClickBridge = () => {
        if (streamlitDocument) {
            return;
        }
        try {
            streamlitDocument = window.parent.document;
            streamlitDocument.addEventListener("click", handlePromoClick, true);
        } catch (error) {
            streamlitDocument = null;
        }
    };

    const handleRender = (event) => {
        if (
            event.origin !== streamlitOrigin
            || event.source !== window.parent
            || event.data?.type !== TYPE_RENDER
        ) {
            return;
        }
        const args = event.data.args || {};
        if (
            args.version !== VERSION
            || args.source !== SOURCE
            || !isExactOrigin(args.parent_origin)
        ) {
            parentOrigin = "";
            promoHostReady = false;
            return;
        }
        parentOrigin = args.parent_origin;
        installPromoClickBridge();
        postToAgentHome(readyMessage());

        if (
            typeof args.ack_request_id === "string"
            && (args.ack_status === "accepted" || args.ack_status === "duplicate")
        ) {
            postToAgentHome({
                type: TYPE_ACK,
                version: VERSION,
                request_id: args.ack_request_id,
                prompt: null,
                source: SOURCE,
                status: args.ack_status,
            });
        }
        postToStreamlit({
            isStreamlitMessage: true,
            type: TYPE_SET_FRAME_HEIGHT,
            height: 0,
        });
    };

    const handleInitialPrompt = (event) => {
        if (
            !parentOrigin
            || event.origin !== parentOrigin
            || event.source !== window.top
            || !isInitialPrompt(event.data)
        ) {
            return;
        }
        postToStreamlit({
            isStreamlitMessage: true,
            type: TYPE_SET_COMPONENT_VALUE,
            value: event.data,
            dataType: "json",
        });
    };

    const handlePromoHostMessage = (event) => {
        if (
            !parentOrigin
            || event.origin !== parentOrigin
            || event.source !== window.top
        ) {
            return;
        }
        if (isPromoHostReady(event.data)) {
            promoHostReady = true;
            if (pendingPromoRequest?.attempt === 0) {
                clearPromoAckTimer();
                sendPromoOpenRequest();
            }
            return;
        }
        if (
            pendingPromoRequest
            && isPromoVideoAck(event.data)
            && event.data.request_id === pendingPromoRequest.requestId
        ) {
            clearPromoAckTimer();
            pendingPromoRequest = null;
        }
    };

    const cleanupPromoBridge = () => {
        clearPromoAckTimer();
        pendingPromoRequest = null;
        promoHostReady = false;
        if (streamlitDocument) {
            streamlitDocument.removeEventListener("click", handlePromoClick, true);
            streamlitDocument = null;
        }
    };

    window.addEventListener("message", (event) => {
        handleRender(event);
        handleInitialPrompt(event);
        handlePromoHostMessage(event);
    });
    window.addEventListener("pagehide", cleanupPromoBridge, { once: true });

    postToStreamlit({
        isStreamlitMessage: true,
        type: TYPE_COMPONENT_READY,
        apiVersion: 1,
    });
})();
</script>
</body>
</html>
